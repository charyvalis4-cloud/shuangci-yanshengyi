<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雙詞衍生義闖關站（遊戲版）</title>
<style>
:root{--bg:#fdf5fa;--fg:#2d2530;--muted:#7b6f7e;--card:#fff;--bd:#efd6e5;--ac:#b5345f;--ac2:#8e2449;--ok:#dff3e6;--okb:#3a9a5c;--bad:#fbe1e1;--badb:#c94141;--star:#e6a700}
@media (prefers-color-scheme:dark){:root{--bg:#1d171b;--fg:#f1e8ee;--muted:#b3a5ae;--card:#2a2127;--bd:#4a3843;--ac:#e0688f;--ac2:#f08aab;--ok:#1f4130;--okb:#6fd193;--bad:#4d2424;--badb:#f08a8a;--star:#ffcc33}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:880px;margin:0 auto;padding:16px 16px 64px}
a{color:var(--ac)}
.crumb{font-size:14px;color:var(--muted)}
h1{color:var(--ac);text-align:center;font-size:clamp(1.6rem,5vw,2.3rem);margin:.5em 0 .1em}
.lead{text-align:center;color:var(--muted);margin:0 0 1em}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:0 0 14px}
select,input,button{font:inherit;color:inherit}
select,input[type=text],input[type=number]{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px}
.who{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;font-size:.95em;margin-bottom:14px}
.who input{width:5.5em}
.level{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-left:10px solid var(--c,#ccc);border-radius:22px;padding:16px 20px;margin:0 0 14px;cursor:pointer;transition:transform .12s}
.level:hover,.level:focus-visible{transform:translateY(-2px);border-color:var(--c)}
.level .ic{font-size:2.3rem;line-height:1;width:1.3em;text-align:center}
.level b{display:block;font-size:1.2rem}
.level small{color:var(--muted)}
.level .st{margin-left:auto;font-size:1.6rem;letter-spacing:2px;color:var(--star);white-space:nowrap}
.box{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:16px 20px;margin:0 0 14px}
.box h2{font-size:1.15rem;margin:0 0 10px}
.box h2 small{font-weight:normal;color:var(--muted);margin-left:8px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 18px;cursor:pointer;font-weight:bold}
.btn:hover{background:var(--ac2)}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--bd);font-weight:normal}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hidden{display:none!important}
/* 作答畫面 */
#play .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.qcard{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:20px}
.qtag{display:inline-block;font-size:.85em;background:var(--bd);border-radius:8px;padding:0 8px;margin-bottom:6px}
.ctx{font-size:.95em;background:var(--bg);border-radius:12px;padding:10px 14px;margin:0 0 10px;max-height:14em;overflow:auto;text-indent:2em}
.stem{font-size:1.25rem;margin:.2em 0 .8em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.opts.long{grid-template-columns:1fr}
.opt{text-align:left;background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:10px 14px;cursor:pointer;font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.right{background:var(--ok);border-color:var(--okb)}
.opt.wrong{background:var(--bad);border-color:var(--badb)}
.fillrow{display:flex;gap:10px;flex-wrap:wrap}
.fillrow input{font-size:1.2rem;width:10em}
.fb{margin-top:12px;font-weight:bold;min-height:1.5em}
.fb.ok{color:var(--okb)}.fb.no{color:var(--badb)}
.fb .x{font-weight:normal;color:var(--fg);font-size:.95em}
.result{text-align:center}
.result .big{font-size:3rem;color:var(--star);letter-spacing:6px}
.wlist{margin:10px 0 0;padding-left:1.3em}
.wlist li{margin:.3em 0}
/* 抽題區 */
.chips{display:flex;flex-wrap:wrap;gap:6px 10px}
.chips label{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.preview{max-height:24em;overflow:auto;background:var(--bg);border-radius:12px;padding:8px 14px;margin-top:10px;font-size:.95em}
.preview ol{padding-left:1.4em;margin:.4em 0}
/* 投影 */
#proj{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding:2vh 3vw;overflow:auto}
#proj .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:1.3rem}
#proj .pq{flex:1;display:flex;flex-direction:column;justify-content:center}
#proj .pstem{font-size:clamp(1.8rem,4.5vw,3.6rem);font-weight:bold;margin:0 0 3vh;line-height:1.4}
#proj .popts{display:grid;grid-template-columns:repeat(2,1fr);gap:2vh 2vw}
#proj .popts.long{grid-template-columns:1fr}
#proj .popts div{font-size:clamp(1.3rem,3.2vw,2.6rem);background:var(--card);border:3px solid var(--bd);border-radius:20px;padding:1.5vh 2vw}
#proj .popts div.right{background:var(--ok);border-color:var(--okb)}
#proj .pans{font-size:clamp(1.3rem,3vw,2.4rem);color:var(--okb);font-weight:bold;min-height:1.6em;margin-top:2vh}
#proj .teams{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:2vh}
#proj .team{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:6px 14px;font-size:1.3rem;display:flex;gap:8px;align-items:center}
#proj .team b{font-size:1.8rem;min-width:1.5em;text-align:center}
#proj .team button{font-size:1.2rem;border-radius:10px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;width:2em}
#proj .hint{color:var(--muted);font-size:1rem;text-align:center;margin-top:1vh}
/* 列印 */
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  main,#proj{display:none!important}
  #printArea{display:block;font:12pt/1.7 "Microsoft JhengHei","PingFang TC",sans-serif;color:#000}
  #printArea h1{font-size:16pt;text-align:center;color:#000}
  #printArea .pq{break-inside:avoid;margin:0 0 10pt}
}
</style>
</head>
<body>
<main>
<div class="crumb"><a href="../">← 雙詞衍生義（互動版）</a>　<a href="../shuangci-handout.docx">📄 Word 講義</a>　<a href="../shuangci-handout-color.docx">🎨 Word 講義（彩色版）</a></div>
<h1>📚 雙詞衍生義闖關站</h1>
<p class="lead">題庫取自〈雙詞衍生義〉講義（本義、衍生義、字形），每次出題都不同</p>

<div class="toolbar"><span id="loadMsg" class="crumb"></span></div>
<div class="who" id="who">
  <label>班級 <input id="f-cls" type="text" maxlength="8" placeholder="711" autocomplete="off"></label>
  <label>座號 <input id="f-seat" type="text" maxlength="2" inputmode="numeric" autocomplete="off"></label>
  <label>姓名 <input id="f-name" type="text" maxlength="10" autocomplete="off"></label>
</div>

<section id="home">
  <div id="levels"></div>

  <div class="box">
    <h2>🧠 錯題本（<span id="wbn">0</span> 題）<small>答錯會自動收進來，連續答對 2 次才畢業</small></h2>
    <div class="row">
      <button class="btn" id="wbReview" type="button">複習錯題</button>
      <button class="btn ghost" id="wbPrint" type="button">🖨️ 列印我的錯題卷</button>
      <button class="btn ghost" id="wbDoc" type="button">⬇️ 下載錯題本（Word）</button>
      <button class="btn ghost" id="wbClear" type="button">清空</button>
    </div>
  </div>

  <div class="box">
    <h2>📥 題庫抽題與下載區<small>自選範圍抽題，分「學生版／教師版」下載</small></h2>
    <button class="btn" id="openPick" type="button">進入抽題區</button>
    <div id="pick" class="hidden" style="margin-top:12px">
      <div class="chips" id="pkRounds" style="display:none"></div>
      <p style="margin:.8em 0 .2em">題型</p>
      <div class="chips" id="pkTypes"></div>
      <div class="row" style="margin-top:10px">
        <label>題數 <input id="pkN" type="number" min="5" max="200" value="30" style="width:5em"></label>
        <button class="btn" id="pkGo" type="button">抽題</button>
        <button class="btn ghost" id="pkStu" type="button" disabled>⬇️ 學生版</button>
        <button class="btn ghost" id="pkTea" type="button" disabled>⬇️ 教師版</button>
        <button class="btn ghost" id="pkPrint" type="button" disabled>🖨️ 列印</button>
      </div>
      <div class="preview hidden" id="pkPrev"></div>
    </div>
  </div>

  <div class="box">
    <h2>📽️ 上課投影模式<small>大字、五組計分、按空白鍵揭曉</small></h2>
    <div class="row" id="projBtns"></div>
  </div>
</section>

<section id="play" class="hidden">
  <div class="top"><b id="pTitle"></b><span id="pCount"></span><button class="btn ghost" id="pQuit" type="button">← 回關卡</button></div>
  <div class="bar"><i id="pBar"></i></div>
  <div class="qcard" id="qcard"></div>
</section>

<section id="done" class="hidden">
  <div class="qcard result" id="doneBox"></div>
</section>
</main>

<div id="proj" class="hidden" role="dialog" aria-label="上課投影模式">
  <div class="ph"><b id="prTitle"></b><span id="prCount"></span><button class="btn ghost" id="prQuit" type="button">✕ 離開</button></div>
  <div class="pq"><div class="pstem" id="prStem"></div><div class="popts" id="prOpts"></div><div class="pans" id="prAns"></div></div>
  <div class="teams" id="prTeams"></div>
  <div class="hint">空白鍵：揭曉／下一題　←→：上一題／下一題　+／-：調整組數</div>
</div>

<div id="printArea"></div>

    Array.prototype.forEach.call($('projBtns').querySelectorAll('button'), function (b) { b.onclick = function () { startProj(b.getAttribute('data-lv')); }; });
  }
  function setRound() { document.title = '雙詞衍生義闖關站'; $('loadMsg').textContent = B.idioms.length + ' 個雙詞'; renderLevels(); }

  ['f-cls', 'f-seat', 'f-name'].forEach(function (id) {
    var v = store.get('shuangci-' + id, ''); if (v && !$(id).value) $(id).value = v;
    $(id).addEventListener('change', function () { store.set('shuangci-' + id, $(id).value.trim()); });
  });

  // ---------- 作答 ----------
  var cur = null;
  function show(id) { ['home', 'play', 'done'].forEach(function (s) { $(s).classList.toggle('hidden', s !== id); }); window.scrollTo(0, 0); }
  function startLevel(lv) {
    if (!B) return;
    var all = gen(B, lv), qs = sample(all, PER);
    var meta = LEVELS.filter(function (x) { return x.id === lv; })[0];
    cur = { lv: lv, title: meta.name, qs: qs, i: 0, ok: 0, wrong: [], review: false };
    show('play'); renderQ();
  }
  function startReview() {
    var items = Object.keys(wb()).map(function (k) { return wb()[k].q; });
    if (!items.length) { alert('錯題本是空的，太棒了！'); return; }
    cur = { lv: 'review', title: '🧠 錯題複習', qs: sample(items, Math.min(20, items.length)), i: 0, ok: 0, wrong: [], review: true };
    show('play'); renderQ();
  }
  function renderQ() {
    var q = cur.qs[cur.i];
    $('pTitle').textContent = cur.title;
    $('pCount').textContent = '第 ' + (cur.i + 1) + ' / ' + cur.qs.length + ' 題　答對 ' + cur.ok;
    $('pBar').style.width = (cur.i / cur.qs.length * 100) + '%';
    var long = q.t === 'mc' && q.o.some(function (o) { return [...o].length > 12; });
    var h = '';
    if (q.tag || cur.review) h += '<span class="qtag">' + esc('' + (q.tag || '')) + '</span>';
    if (q.ctx) h += '<div class="ctx">' + esc(q.ctx) + '</div>';
    h += '<p class="stem">' + esc(q.s) + '</p>';
    if (q.t === 'mc') h += '<div class="opts' + (long ? ' long' : '') + '">' + q.o.map(function (o, k) { return '<button type="button" class="opt" data-k="' + k + '">(' + L[k] + ') ' + esc(o) + '</button>'; }).join('') + '</div>';
    else h += '<form class="fillrow" id="fillF"><input id="fillI" type="text" autocomplete="off" aria-label="作答"><button class="btn" type="submit">送出</button></form>';
    h += '<div class="fb" id="fb" aria-live="polite"></div><div class="row" style="margin-top:10px"><button class="btn hidden" id="next" type="button">' + (cur.i + 1 < cur.qs.length ? '下一題 →' : '看結果') + '</button></div>';
    $('qcard').innerHTML = h;
    if (q.t === 'mc') Array.prototype.forEach.call($('qcard').querySelectorAll('.opt'), function (b) { b.onclick = function () { answer(+b.getAttribute('data-k')); }; });
    else { $('fillF').onsubmit = function (e) { e.preventDefault(); var v = $('fillI').value.trim(); if (v) answer(v); }; $('fillI').focus(); }
    $('next').onclick = next;
  }
  function norm(s) { return String(s).replace(/[\s　（）()「」]/g, ''); }
  function answer(v) {
    var q = cur.qs[cur.i], ok;
    if (q.t === 'mc') {
      ok = v === q.a;
      Array.prototype.forEach.call($('qcard').querySelectorAll('.opt'), function (b) {
        var k = +b.getAttribute('data-k'); b.disabled = true;
        if (k === q.a) b.classList.add('right'); else if (k === v) b.classList.add('wrong');
      });
    } else {
      ok = [q.ans].concat(q.alt || []).some(function (a) { return norm(a) === norm(v); });
      $('fillI').disabled = true; $('fillF').querySelector('button').disabled = true;
    }
    if (ok) cur.ok++; else cur.wrong.push(q);
    wbMark(q, ok);
    var fb = $('fb');
    fb.className = 'fb ' + (ok ? 'ok' : 'no');
    fb.innerHTML = (ok ? '✔ 答對了！' : '✘ 正確答案：' + esc(ansText(q))) + (q.x ? '<div class="x">' + esc(q.x) + '</div>' : '');
    $('pCount').textContent = '第 ' + (cur.i + 1) + ' / ' + cur.qs.length + ' 題　答對 ' + cur.ok;
    $('next').classList.remove('hidden'); $('next').focus();
  }
  function next() { cur.i++; if (cur.i < cur.qs.length) renderQ(); else finish(); }
  function finish() {
    var n = cur.qs.length, k = cur.ok, pct = k / n;
    var s = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .5 ? 1 : 0;
    if (!cur.review) {
      var st = store.get(starsKey(R), {}); if (s > (st[cur.lv] || 0)) { st[cur.lv] = s; store.set(starsKey(R), st); }
      sendScore(cur, k, n);
    }
    var h = '<h2>' + esc(cur.title) + '</h2><div class="big">' + starStr(s) + '</div><p style="font-size:1.3rem">答對 ' + k + ' / ' + n + ' 題</p><p id="sendMsg" class="crumb"></p>';
    if (cur.wrong.length) h += '<div style="text-align:left"><b>這次答錯的題目（已收進錯題本）：</b><ol class="wlist">' + cur.wrong.map(function (q) { return '<li>' + esc(q.s) + '<br><span class="crumb">答案：' + esc(ansText(q)) + '</span></li>'; }).join('') + '</ol></div>';
    h += '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="again" type="button">再玩一次</button><button class="btn ghost" id="back" type="button">回關卡</button></div>';
    $('doneBox').innerHTML = h; show('done');
    var lv = cur.lv;
    $('again').onclick = function () { if (lv === 'review') startReview(); else startLevel(lv); };
    $('back').onclick = function () { renderLevels(); show('home'); };
    if (window._sendMsg) { $('sendMsg').textContent = window._sendMsg; window._sendMsg = ''; }
  }
  function sendScore(c, k, n) {
    window._sendMsg = '';
    if (!window.GuwenAuth || !GuwenAuth.user) { window._sendMsg = ''; return; }
    var cls = $('f-cls').value.trim(), seat = $('f-seat').value.trim();
    var meta = LEVELS.filter(function (x) { return x.id === c.lv; })[0];
    var ans = c.qs.map(function (q) { return c.wrong.indexOf(q) >= 0 ? '0' : '1'; }).join('');
    fetch('/api/scores', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ quiz: '雙詞衍生義闖關', cls: cls, seat: seat, mode: meta.short, total: Math.round(k * 100 / n), detail: { 關卡: meta.name, 答對: k + '/' + n }, answers: ans }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { var m = $('sendMsg'); if (m) m.textContent = j && j.ok ? '✓ 成績已送給老師' : '成績送出失敗'; })
      .catch(function () { var m = $('sendMsg'); if (m) m.textContent = '成績送出失敗（網路問題）'; });
  }
  $('pQuit').onclick = function () { if (confirm('離開這一關？目前的作答不會計分。')) { renderLevels(); show('home'); } };
  $('wbReview').onclick = startReview;
  $('wbClear').onclick = function () { if (confirm('確定清空錯題本？')) wbSave({}); };

  // ---------- 列印／下載 ----------
  function sheetHTML(title, qs, withAns, forWord) {
    var h = '<h1>' + esc(title) + '</h1><p>班級：＿＿＿＿　座號：＿＿＿＿　姓名：＿＿＿＿＿＿　得分：＿＿＿＿</p>';
    qs.forEach(function (q, i) {
      h += '<div class="pq"><p>' + (q.t === 'mc' ? '（　）' : '') + (i + 1) + '. ' + '' + esc(q.s) + '</p>';
      if (q.ctx) h += '<p style="font-size:10pt;text-indent:2em">' + esc(q.ctx) + '</p>';
      if (q.t === 'mc') {
        var long = q.o.some(function (o) { return [...o].length > 12; });
        h += long ? q.o.map(function (o, k) { return '<p style="margin:0 0 0 2em">(' + L[k] + ') ' + esc(o) + '</p>'; }).join('') : '<p style="margin:0 0 0 2em">' + q.o.map(function (o, k) { return '(' + L[k] + ') ' + esc(o); }).join('　') + '</p>';
      } else h += '<p style="margin:0 0 0 2em">答：＿＿＿＿＿＿＿＿</p>';
      if (withAns) h += '<p style="margin:0 0 0 2em;color:#b5345f">答案：' + esc(ansText(q)) + (q.x ? '　' + esc(q.x) : '') + '</p>';
      h += '</div>';
    });
    if (!withAns) {
      h += '<h2 style="page-break-before:always">參考答案</h2><p>' + qs.map(function (q, i) { return (i + 1) + '.' + (q.t === 'mc' ? L[q.a] : q.ans); }).join('　') + '</p>';
    }
    return h;
  }
  function printSheet(title, qs, withAns) { $('printArea').innerHTML = sheetHTML(title, qs, withAns); window.print(); }
  function downloadDoc(filename, title, qs, withAns) {
    var body = sheetHTML(title, qs, withAns, true);
    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>body{font-family:"Microsoft JhengHei";font-size:12pt;line-height:1.6}h1{font-size:16pt;text-align:center}p{margin:0 0 4pt}.pq{margin:0 0 8pt}</style></head><body>' + body + '</body></html>';
    var blob = new Blob(['﻿', html], { type: 'application/msword' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function wbItems() { var o = wb(); return Object.keys(o).map(function (k) { return o[k].q; }).sort(function (a, b) { return a.r - b.r; }); }
  function who() { var n = $('f-name').value.trim(); return n ? n + '的' : '我的'; }
  $('wbPrint').onclick = function () { var q = wbItems(); if (!q.length) return alert('錯題本是空的'); printSheet(who() + '雙詞錯題卷', q, false); };
  $('wbDoc').onclick = function () { var q = wbItems(); if (!q.length) return alert('錯題本是空的'); downloadDoc('雙詞錯題本.doc', who() + '雙詞錯題本', q, true); };

  // ---------- 抽題區 ----------
  var TYPES = LEVELS.map(function (l) { return { id: l.id, name: l.name.replace(/^.*：/, '') }; });
  var picked = [];
  $('openPick').onclick = function () {
    $('pick').classList.toggle('hidden');
    if ($('pkRounds').children.length) return;
    var h = '';
    for (var i = 1; i <= ROUNDS; i++) h += '<label><input type="checkbox" value="' + i + '"' + (i === R ? ' checked' : '') + '> 第' + i + '回</label>';
    $('pkRounds').innerHTML = h;
    $('pkTypes').innerHTML = TYPES.map(function (t) { return '<label><input type="checkbox" value="' + t.id + '" checked> ' + t.name + '</label>'; }).join('');
  };
  function checked(id) { return Array.prototype.map.call($(id).querySelectorAll('input:checked'), function (x) { return x.value; }); }
  $('pkGo').onclick = function () {
    var rs = checked('pkRounds').map(Number), ts = checked('pkTypes'), n = Math.max(1, Math.min(200, +$('pkN').value || 30));
    if (!rs.length || !ts.length) return alert('請至少選一個回次和一種題型');
    $('pkPrev').classList.remove('hidden'); $('pkPrev').textContent = '抽題中…';
    Promise.all(rs.map(load)).then(function (bs) {
      var pool = [];
      bs.forEach(function (b) { ts.forEach(function (t) { pool = pool.concat(gen(b, t)); }); });
      picked = sample(pool, n).sort(function (a, b) { return a.r - b.r; });
      $('pkPrev').innerHTML = '<b>共 ' + picked.length + ' 題</b>（題庫 ' + pool.length + ' 題）<ol>' + picked.map(function (q) { return '<li>' + esc(q.s) + ' <span class="crumb">→ ' + esc(ansText(q)) + '</span></li>'; }).join('') + '</ol>';
      ['pkStu', 'pkTea', 'pkPrint'].forEach(function (id) { $(id).disabled = !picked.length; });
    }).catch(function () { $('pkPrev').textContent = '題庫載入失敗，請重新整理'; });
  };
  function pkTitle() { return '雙詞衍生義 抽題卷'; }
  $('pkStu').onclick = function () { downloadDoc(pkTitle() + '（學生版）.doc', pkTitle(), picked, false); };
  $('pkTea').onclick = function () { downloadDoc(pkTitle() + '（教師版）.doc', pkTitle() + '（教師版）', picked, true); };
  $('pkPrint').onclick = function () { printSheet(pkTitle(), picked, false); };

  // ---------- 投影模式 ----------
  var P = null;
  function startProj(lv) {
    if (!B) return;
    var meta = LEVELS.filter(function (x) { return x.id === lv; })[0];
    P = { qs: sample(gen(B, lv), PER), i: 0, shown: false, title: meta.name, teams: store.get('shuangci-teams', [0, 0, 0, 0, 0]) };
    $('proj').classList.remove('hidden'); document.body.style.overflow = 'hidden';
    projRender();
  }
  function projRender() {
    var q = P.qs[P.i];
    $('prTitle').textContent = P.title;
    $('prCount').textContent = (P.i + 1) + ' / ' + P.qs.length;
    $('prStem').textContent = q.s;
    var long = q.t === 'mc' && q.o.some(function (o) { return [...o].length > 10; });
    $('prOpts').className = 'popts' + (long ? ' long' : '');
    $('prOpts').innerHTML = q.t === 'mc' ? q.o.map(function (o, k) { return '<div class="' + (P.shown && k === q.a ? 'right' : '') + '">(' + L[k] + ') ' + esc(o) + '</div>'; }).join('') : '';
    $('prAns').textContent = P.shown ? '答案：' + ansText(q) + (q.x ? '　' + q.x : '') : '';
    $('prTeams').innerHTML = P.teams.map(function (s, k) { return '<div class="team">第' + (k + 1) + '組 <button type="button" data-t="' + k + '" data-d="-1" aria-label="第' + (k + 1) + '組減一分">−</button><b>' + s + '</b><button type="button" data-t="' + k + '" data-d="1" aria-label="第' + (k + 1) + '組加一分">＋</button></div>'; }).join('');
    Array.prototype.forEach.call($('prTeams').querySelectorAll('button'), function (b) { b.onclick = function () { P.teams[+b.getAttribute('data-t')] += +b.getAttribute('data-d'); store.set('shuangci-teams', P.teams); projRender(); }; });
  }
  function projStep(d) {
    if (d > 0 && !P.shown) { P.shown = true; return projRender(); }
    var j = P.i + d; if (j < 0 || j >= P.qs.length) return;
    P.i = j; P.shown = false; projRender();
  }
  function projQuit() { $('proj').classList.add('hidden'); document.body.style.overflow = ''; P = null; }
  $('prQuit').onclick = projQuit;
  document.addEventListener('keydown', function (e) {
    if (!P) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); projStep(1); }
    else if (e.key === 'ArrowRight') projStep(1);
    else if (e.key === 'ArrowLeft') projStep(-1);
    else if (e.key === 'Escape') projQuit();
    else if (e.key === '+' || e.key === '=') { if (P.teams.length < 8) { P.teams.push(0); store.set('shuangci-teams', P.teams); projRender(); } }
    else if (e.key === '-') { if (P.teams.length > 2) { P.teams.pop(); store.set('shuangci-teams', P.teams); projRender(); } }
    else if (e.key === '0') { P.teams = P.teams.map(function () { return 0; }); store.set('shuangci-teams', P.teams); projRender(); }
  });

  wbCount();
  setRound();
})();
</script>
